
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nueva orden de compra - Vega Frank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-dark text-white">
            <h3>Nueva orden de compra</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/ordencompra/registrar}"
                  th:object="${ordenCompra}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Proveedor</label>

                    <select class="form-select"
                            th:field="*{proveedor.idProveedor}"
                            required>

                        <option value="">Seleccione proveedor</option>

                        <option th:each="proveedor : ${lstProveedores}"
                                th:value="${proveedor.idProveedor}"
                                th:text="${proveedor.ruc + ' - ' + proveedor.razonSocial}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Monto</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{monto}"
                           step="0.01"
                           min="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Dirección de entrega
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{direccionEntrega}"
                           maxlength="150"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Fecha de entrega
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{fechaEntrega}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>

                    <select class="form-select"
                            th:field="*{estado}"
                            required>

                        <option value="P">Pendiente</option>
                        <option value="C">Completado</option>
                        <option value="A">Anulado</option>

                    </select>
                </div>

                <div class="text-end">

                    <a th:href="@{/ordencompra/listado}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-success">
                        Registrar
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
