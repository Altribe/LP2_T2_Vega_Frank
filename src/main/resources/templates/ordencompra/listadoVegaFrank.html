<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Listado de órdenes de compra - Vega Frank</title>
    <meta http-equiv="Content-Type"
          content="text/html; charset=UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">

                <div class="row">
                    <div class="col-md-10">
                        <h1 class="card-title">
                            Listado de órdenes de compra
                        </h1>
                    </div>

                    <div class="col-md-2">
                        <a th:href="@{/ordencompra/nuevo}"
                           class="btn btn-success w-100">
                            <i class="fa-solid fa-plus"></i>
                            Nuevo
                        </a>
                    </div>
                </div>

                <div class="table-responsive" style="width: 100%;">

					<table class="table table-hover"
					style="min-width: 1350px;">

                        <thead class="table-dark text-center">
                            <tr>
                                <th>Número</th>
                                <th>Fecha de entrega</th>
                                <th>Dirección de entrega</th>
                                <th>Proveedor</th>
                                <th>Rubro</th>
                                <th>Página web</th>
                                <th>Monto</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody class="table-secondary text-nowrap">

                            <tr th:each="orden : ${lstOrdenes}">

                                <td th:text="${orden.nroOrden}"></td>

                                <td th:text="${#temporals.format(orden.fechaEntrega, 'dd-MM-yyyy')}"></td>

                                <td th:text="${orden.direccionEntrega}"></td>

                                <td th:text="${orden.proveedor.ruc + ' - ' + orden.proveedor.razonSocial}"></td>

                                <td th:text="${orden.proveedor.rubro.denominacion}"></td>

                                <td th:text="${orden.proveedor.paginaWeb}"></td>

                                <td th:text="${'S/ ' + #numbers.formatDecimal(orden.monto, 1, 'COMMA', 2, 'POINT')}"></td>

                                <td th:text="${orden.estado == 'P' ? 'Pendiente' : (orden.estado == 'C' ? 'Completado' : 'Anulado')}"></td>

                                <td class="text-center align-middle">

                                    <a th:href="@{/ordencompra/edicion/{id}(id=${orden.nroOrden})}"
                                       class="btn btn-outline-primary"
                                       title="Editar">

                                        <i class="fa-regular fa-pen-to-square"></i>

                                    </a>

                                </td>

                            </tr>

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const mensaje = /*[[${mensaje}]]*/ null;
        const success = /*[[${success}]]*/ null;

        if (mensaje !== null) {
            Swal.fire({
                icon: success ? 'success' : 'error',
                title: success ? 'Correcto' : 'Error',
                text: mensaje,
                confirmButtonText: 'Aceptar'
            });
        }
    </script>

</body>
</html>
